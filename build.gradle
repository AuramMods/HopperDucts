buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197'
    }
}

apply plugin: 'net.minecraftforge.gradle'

group = 'net.fybertech.hopperducts'
version = '1.5'

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    mappings channel: 'stable', version: '39-1.12'

    runs {
        client {
            workingDirectory file('run')
        }
        server {
            workingDirectory file('run/server')
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2864'
}

// Forge 1.12.2 expects classes and resources in the same directory for dev runs.
sourceSets.each { sourceSet ->
    def outputDir = layout.buildDirectory.dir("sourceSets/${sourceSet.name}").get().asFile
    sourceSet.output.resourcesDir = outputDir
    sourceSet.java.outputDir = outputDir
}

jar.finalizedBy('reobfJar')
